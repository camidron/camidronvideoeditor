<style>
/* Layout: la home es el escritorio. Fondo = video del Framer. Carpetas pastel
   sueltas como en la referencia; cada una abre su propia ventana chica (sin
   barra de título) que se puede arrastrar. Un único reproductor para los videos.
   Look único y deliberado: no depende del tema del sistema. */
:root{
  color-scheme: light;
  --bg:#ece9e4;            /* fondo mientras carga el video */
  --label:#2b2b2e;         /* texto de etiquetas */
  --glass:rgb(255 255 255 / .62);
  --win:rgb(250 250 250 / .94);
  --line:rgb(0 0 0 / .08);
  --muted:#7a7a80;
  --sel:#3a3a3e;           /* etiqueta seleccionada */
  --yellow:#f7d65e; --yellow-dk:#e5bb2b;   /* amarillo */
  --amber:#f6bb4c;  --amber-dk:#df9a1f;    /* ámbar */
  --orange:#f39a4e; --orange-dk:#d9782a;   /* naranja */
  --tang:#ec7a44;   --tang-dk:#cc5a24;     /* mandarina */
  --pixel:"Silkscreen", "Courier New", ui-monospace, monospace;
  --ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--label);font-family:var(--ui);font-size:14px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid #3a7bd5;outline-offset:3px;border-radius:8px}

/* ---------- escritorio ---------- */
.desktop{position:relative;height:100%;min-height:560px;overflow:hidden;isolation:isolate}
.wall{position:absolute;inset:0;z-index:-2;background:var(--bg) url("fondo.jpg") center/cover no-repeat}
@media (max-width:960px){.wall{background-image:url("fondo-sm.jpg")}}
.wall iframe{position:absolute;top:50%;left:50%;width:max(100%,calc(100svh * 1.7778));height:max(100%,calc(100vw * .5625));transform:translate(-50%,-50%);border:0;pointer-events:none;opacity:0;transition:opacity 1.2s}
.wall iframe.on{opacity:1}
.wall{overflow:hidden}


nav.top{position:absolute;z-index:20;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px;padding:6px 10px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 1px 0 rgb(255 255 255 / .6) inset,0 6px 20px rgb(0 0 0 / .08);width:max-content;max-width:calc(100% - 32px)}
nav.top a{font-family:var(--pixel);font-size:12.5px;text-decoration:none;padding:5px 10px;border-radius:999px;white-space:nowrap}
nav.top a:hover{background:rgb(0 0 0 / .06)}

/* íconos */
.item{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:grid;justify-items:center;gap:8px;width:calc(clamp(90px,9.8vw,128px) * var(--sc,1));text-align:center;z-index:5;animation:drop .6s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--n)*90ms + 200ms)}
@keyframes drop{from{opacity:0;translate:0 14px}}
.item .art{display:grid;place-items:center;width:100%;aspect-ratio:1.25;border-radius:14px;transition:background .15s}
.item svg.folder{width:88%;height:auto;filter:drop-shadow(0 6px 10px rgb(0 0 0 / .10));transition:transform .2s}
.item:hover svg.folder{transform:translateY(-3px)}
.item .lab{font-size:calc(12.5px * var(--lsc,1));font-weight:500;line-height:1.3;padding:2px 7px;border-radius:5px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.item[aria-expanded="true"] .art,.item:focus-visible .art{background:rgb(255 255 255 / .45);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .6)}
.item[aria-expanded="true"] .lab{background:var(--sel);color:#fff}
.item:focus-visible{outline:none}

/* ícono de archivo png (about) */
.png{width:72%;aspect-ratio:1.1;background:#fff;border:1px solid #ddd;box-shadow:0 6px 12px rgb(0 0 0 / .1);display:grid;place-items:center;padding:8px;transition:transform .2s}
.item:hover .png{transform:translateY(-3px) rotate(-1deg)}
.png.photo{width:58%;aspect-ratio:4/5;padding:2px;background:#fff;border:0;border-radius:1px;box-shadow:0 0 0 .5px rgb(0 0 0 / .18),0 3px 8px rgb(0 0 0 / .16);transform:none}
.item:hover .png.photo{transform:translateY(-3px)}
.png.photo img{width:100%;height:100%;object-fit:cover;display:block}
.png b{font-family:var(--pixel);font-size:clamp(11px,1.2vw,15px);line-height:1;color:#fff;background:var(--orange-dk);padding:6px 8px;border-radius:999px;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--yellow)}

.sign{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;z-index:4;left:clamp(16px,3vw,36px);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(16px,3vw,32px));font-family:var(--pixel);font-size:12px;padding:6px 12px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sign h1{display:inline;font:inherit;font-weight:700;margin:0}

/* ---------- ventanas de carpeta ---------- */
.fwin{position:fixed;z-index:30;left:var(--x);top:var(--y);width:min(600px,calc(100vw - 32px));height:min(430px,calc(100svh - 120px));display:flex;flex-direction:column;background:var(--win);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-radius:14px;box-shadow:0 0 0 .5px rgb(0 0 0 / .18),0 24px 60px rgb(0 0 0 / .22);transform-origin:var(--ox,50%) var(--oy,50%);animation:open .32s cubic-bezier(.2,.9,.25,1) both;touch-action:none;cursor:grab}
.fwin.dragging{cursor:grabbing;user-select:none}
@keyframes open{from{opacity:0;transform:scale(.18)}}
.fwin.closing{animation:shut .2s ease-in both}
@keyframes shut{to{opacity:0;transform:scale(.2)}}
.x{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgb(0 0 0 / .06);color:#555;z-index:2;cursor:pointer}
.x:hover{background:rgb(0 0 0 / .12);color:#111}
.x svg{width:10px;height:10px}
.files{flex:1;overflow:auto;padding:22px 18px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min,150px),1fr));gap:18px 12px;align-content:start;cursor:default;touch-action:pan-y;overscroll-behavior:contain}
.file{display:grid;gap:6px;justify-items:center;text-align:center;padding:6px 4px;border-radius:10px}
.file:hover{background:rgb(0 0 0 / .045)}
.file:focus-visible{outline:none;background:rgb(58 123 213 / .14)}
.thumb{position:relative;width:100%;max-width:100%;aspect-ratio:var(--ar,16/9);border-radius:6px;overflow:hidden;background:var(--ph);box-shadow:0 2px 6px rgb(0 0 0 / .14)}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb img{opacity:0;transition:opacity .4s}.thumb img.ok{opacity:1}
.thumb video{opacity:0}.file:hover .thumb video.ready{opacity:1}
.thumb .dur{position:absolute;right:5px;bottom:5px;font-size:10px;padding:1px 5px;border-radius:4px;background:rgb(0 0 0 / .55);color:#fff;font-variant-numeric:tabular-nums}
.thumb .empty{position:absolute;inset:0;display:grid;place-items:center;padding:6px;font-family:var(--pixel);font-size:9.5px;line-height:1.4;color:rgb(0 0 0 / .55)}
.fname{font-size:12px;line-height:1.3;max-width:100%;overflow-wrap:anywhere;padding:1px 5px;border-radius:4px}
.file:hover .fname,.file:focus-visible .fname{background:var(--sel);color:#fff}
.path{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.path span:first-child{overflow:hidden;text-overflow:ellipsis}

/* ventanas de texto (about / contacto) */
.fwin.note{width:min(440px,calc(100vw - 32px));height:auto;max-height:calc(100svh - 120px)}
.note-body{padding:26px 24px 18px;overflow:auto;cursor:default}
.note-body h2{font-family:var(--pixel);font-size:22px;line-height:1.1;margin:0 0 14px}
.note-body p{margin:0 0 12px;font-size:14.5px;color:#3a3a3e}
.note-body dl{margin:14px 0 0;display:grid;gap:6px;font-size:13px}
.note-body dl div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px;flex-wrap:wrap}
.note-body dt{color:var(--muted)}.note-body dd{margin:0;text-align:right}
.fwin.about{width:min(540px,calc(100vw - 32px))}
.lang{position:absolute;top:10px;right:44px;display:flex;padding:2px;border-radius:999px;background:rgb(0 0 0 / .06);z-index:2}
.lang button{font-family:var(--pixel);font-size:11px;padding:4px 10px;border-radius:999px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--label);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.mail{font-family:var(--pixel);font-size:clamp(15px,3.6vw,19px);padding:10px 12px;border-radius:8px;background:rgb(0 0 0 / .05);overflow-wrap:anywhere;user-select:all;margin:4px 0 14px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--sel);color:#fff;font-size:13px;font-weight:500;text-decoration:none}
.chip.alt{background:rgb(0 0 0 / .07);color:var(--label)}

/* ---------- reproductor ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgb(20 20 22 / .45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.player{position:fixed;z-index:91;left:50%;top:50%;transform:translate(-50%,-50%);width:min(var(--pw,1040px),calc(100vw - 32px));background:#141416;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgb(0 0 0 / .45);animation:pop .25s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes pop{from{opacity:0;scale:.92}}
.player .x{background:rgb(255 255 255 / .12);color:#ddd;top:auto;bottom:9px;right:auto;left:12px;position:absolute}
.pbox{position:relative;width:100%;aspect-ratio:var(--ar,16/9);max-height:calc(100svh - 120px);background:#000;margin-inline:auto}
.pbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pbox .load{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pixel);font-size:12px;color:#888}
.pbot{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 48px;color:#ddd}
.pbot .count{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{padding:6px 11px;border-radius:7px;background:rgb(255 255 255 / .1);font-size:12.5px;text-decoration:none}
.pbtn:hover{background:rgb(255 255 255 / .18)}

/* ---------- celular ---------- */
@media (max-width:720px){
  body{overflow:auto}
  .desktop{height:auto;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 120px) 16px 90px}
  nav.top{max-width:calc(100% - 24px)}
  nav.top a{font-size:11px;padding:4px 7px}
  .icons{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px}
  .item{position:static;transform:none;width:72%;justify-self:center}
  .item .art{aspect-ratio:1.4}
  .fwin{left:12px!important;top:calc(env(safe-area-inset-top,0px) + 12px)!important;width:calc(100vw - 24px);height:calc(100svh - 24px - env(safe-area-inset-top,0px));cursor:default}
  .fwin.note{height:auto}
  .files{--min:130px!important}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const fmt = s => { s = Math.round(s||0); return `${Math.floor(s/60)}:${pad(s%60)}`; };
const slug = t => String(t||"video").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
const isMobile = () => matchMedia("(max-width:720px)").matches;

function parseVimeo(u){
  if(!u) return null;
  const m = String(u).match(/(?:vimeo\.com\/(?:video\/)?|^)(\d{5,})(?:\/([0-9a-f]{6,}))?/i);
  if(!m) return null;
  const h = m[2] || (String(u).match(/[?&]h=([0-9a-f]+)/i)||[])[1] || "";
  return { id:m[1], h };
}

function getMeta(v){
  if(!v) return Promise.resolve(null);
  const k = v.id + (v.h||"");
  if(cache[k]) return Promise.resolve(cache[k]);
  if(inflight[k]) return inflight[k];
  const page = `https://vimeo.com/${v.id}${v.h?"/"+v.h:""}`;
  inflight[k] = fetch(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent(page)}&width=640`)
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if(!d) return null;
      const meta = { t:d.title, d:d.duration, w:d.width, hh:d.height, th:(d.thumbnail_url||"").replace(/_\d+x\d+/, "_640") };
      cache[k] = meta; saveCache(); return meta;
    }).catch(() => null);
  return inflight[k];
}
CATEGORIES.forEach(c => c.videos.forEach((v,i) => { v.vm = parseVimeo(v.url); v.i = i; }));

/* ---- íconos del escritorio ---- */
const ALL = [...CATEGORIES, ...EXTRAS];
const icons = $("#icons");
ALL.forEach((it,n) => {
  const b = document.createElement("button");
  b.className = "item"; b.type = "button"; b.setAttribute("aria-expanded","false");
  b.style.setProperty("--x", it.x+"%"); b.style.setProperty("--y", it.y+"%"); b.style.setProperty("--n", n);
  if(it.scale){ b.style.setProperty("--sc", it.scale); b.style.setProperty("--lsc", 1 + (it.scale-1)/2); b.classList.add("featured"); }
  b.style.order = it.mOrder ?? n;
  const art = it.png
    ? `<span class="png photo"><img src="${ABOUT_PHOTO}" alt="Foto de Cami" width="320" height="400" decoding="async"></span>`
    : `<svg class="folder" viewBox="0 0 150 110" style="--c:var(--${it.color});--dk:var(--${it.color}-dk)"><use href="#folder"/></svg>`;
  b.innerHTML = `<span class="art">${art}</span><span class="lab">${it.label}</span>`;
  b.addEventListener("click", () => openWin(it));
  if(it.videos) b.addEventListener("pointerenter", () => warm(it), {once:true});
  it.icon = b; icons.appendChild(b);
});

/* ---- ventanas ---- */
let z = 30, cascade = 0;
const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
  entries.forEach(en => { if(en.isIntersecting){ io.unobserve(en.target); hydrate(en.target); } });
}, { rootMargin:"200px" }) : null;

function openWin(it){
  if(it.win){ front(it.win); it.win.focus({preventScroll:true}); return; }
  const w = document.createElement("div");
  w.className = "fwin" + (it.videos ? "" : " note");
  w.tabIndex = -1; w.setAttribute("role","dialog"); w.setAttribute("aria-label", it.label);

  /* posición: cerca de la carpeta, en cascada, dentro de la pantalla */
  const r = it.icon.getBoundingClientRect();
  const W = Math.min(it.videos ? 600 : it.key === "about" ? 540 : 440, innerWidth - 32), H = it.videos ? Math.min(430, innerHeight - 120) : (it.key === "about" ? Math.min(520, innerHeight - 120) : 340);
  let x = r.left + r.width/2 - W/2 + cascade*24, y = r.top + r.height*0.2 + cascade*20;
  x = Math.max(16, Math.min(x, innerWidth - W - 16)); y = Math.max(70, Math.min(y, innerHeight - H - 16));
  cascade = (cascade + 1) % 5;
  w.style.setProperty("--x", x+"px"); w.style.setProperty("--y", y+"px");
  w.style.setProperty("--ox", (r.left + r.width/2 - x)+"px"); w.style.setProperty("--oy", (r.top + r.height/2 - y)+"px");

  w.innerHTML = `<button class="x" type="button" aria-label="Cerrar ${it.label}"><svg><use href="#x"/></svg></button>`;
  if(it.videos) buildFolder(w, it);
  else if(it.key === "about") buildAbout(w);
  else buildContact(w);

  w.querySelector(".x").addEventListener("click", () => closeWin(it));
  w.addEventListener("pointerdown", () => front(w));
  makeDraggable(w);
  document.body.appendChild(w);
  it.win = w; front(w);
  it.icon.setAttribute("aria-expanded","true");
  w.focus({preventScroll:true});
}
function closeWin(it){
  const w = it.win; if(!w) return;
  if(w._lang) langRenders.delete(w._lang);
  it.win = null; it.icon.setAttribute("aria-expanded","false");
  w.classList.add("closing");
  setTimeout(() => w.remove(), 200);
}
function front(w){ w.style.zIndex = ++z; }

function buildFolder(w, c){
  warm(c);
  const files = document.createElement("div");
  files.className = "files";
  files.style.setProperty("--min", c.vertical ? "110px" : "160px");
  c.videos.forEach((v,i) => {
    const vert = v.vertical ?? c.vertical;
    const b = document.createElement("button");
    b.type = "button"; b.className = "file";
    b.innerHTML = `
      <span class="thumb" style="--ar:${vert?"9/16":"16/9"};--ph:${placeholder(c,i)}">
        <img alt="" decoding="async" loading="lazy">
        ${v.vm ? "" : `<span class="empty">PEGÁ EL LINK<br>DE VIMEO</span>`}
        <span class="dur" data-dur hidden></span>
      </span>
      <span class="fname" data-name>${v.title ? slug(v.title) : "video_"+pad(i+1)}.mp4</span>`;
    b.addEventListener("click", () => v.vm && openPlayer(c, i));
    b.addEventListener("pointerenter", () => hoverPreview(b, v));
    b._v = v; files.appendChild(b);
    io ? io.observe(b) : hydrate(b);
  });
  const path = document.createElement("div");
  path.className = "path";
  path.innerHTML = `<span>Macintosh HD › Cami › ${c.label}</span><span>${c.videos.length} ítems</span>`;
  w.append(files, path);
}
const ABOUT = {
  en: {
    p: [
      "Hi, I'm Cami. Video editor and colorist with experience in post-production for TV, advertising and digital content. I worked in real time for Telefe, one of Argentina's most important TV networks, editing high volumes of content without losing attention to detail or creativity along the way.",
      "I like to think of editing as a collage: creating meaning from elements that come from very different worlds. I integrate AI tools into my workflow, from script and b-roll generation to voiceover and avatar creation."
    ],
    rows: [["Software","Adobe Suite · CapCut · DaVinci"],["AI tools","Kling · Nano Banana · Seedance · HeyGen · ElevenLabs"],["Based in","Buenos Aires, Argentina · Remote"]]
  },
  es: {
    p: [
      "Hola, soy Cami. Editora de video y colorista con experiencia en postproducción para televisión, publicidad y contenido digital. Trabajé en tiempo real para Telefe, uno de los canales de televisión más importantes de Argentina, editando grandes volúmenes de contenido sin perder la atención al detalle ni la creatividad en el camino.",
      "Me gusta pensar la edición como un collage: crear sentido a partir de elementos que vienen de mundos muy distintos. Integro herramientas de IA en mi flujo de trabajo, desde la generación de guiones y b-roll hasta la locución y la creación de avatares."
    ],
    rows: [["Software","Adobe Suite · CapCut · DaVinci"],["Herramientas de IA","Kling · Nano Banana · Seedance · HeyGen · ElevenLabs"],["Base","Buenos Aires, Argentina · Remoto"]]
  }
};
let lang = "en";
try { lang = localStorage.getItem("lang") || ((navigator.language||"").toLowerCase().startsWith("es") ? "es" : "en"); } catch(e){}
/* selector ES | EN compartido: cambia todas las ventanas abiertas a la vez */
const langRenders = new Set();
function langSwitch(render){
  const sw = document.createElement("div"); sw.className = "lang"; sw.setAttribute("role","group"); sw.setAttribute("aria-label","Idioma / Language");
  sw.innerHTML = `<button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button>`;
  const r = () => { sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang)); render(); };
  sw.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    lang = b.dataset.l; try{ localStorage.setItem("lang", lang); }catch(e){}
    langRenders.forEach(f => f());
  });
  langRenders.add(r); sw._r = r; r();
  return sw;
}
function buildAbout(w){
  w.classList.add("about");
  const d = document.createElement("div"); d.className = "note-body";
  const render = () => {
    const t = ABOUT[lang];
    d.lang = lang;
    d.innerHTML = `<h2>about me</h2>${t.p.map(x => `<p>${x}</p>`).join("")}<dl>${t.rows.map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
  };
  const sw = langSwitch(render);
  w._lang = sw._r;
  w.append(sw, d);
}
const CONTACT = {
  en: { p:"Got a project? Write to me:", copy:"Copy email", copied:"Copied", mail:"Email me" },
  es: { p:"¿Tenés un proyecto? Escribime:", copy:"Copiar email", copied:"Copiado", mail:"Escribirme" }
};
function buildContact(w){
  const d = document.createElement("div"); d.className = "note-body";
  d.innerHTML = `
    <h2>get in touch</h2>
    <p data-t="p"></p>
    <div class="mail" data-mail></div>
    <div class="acts">
      <button class="chip" type="button" data-copy></button>
      <a class="chip alt" data-mailto href="#"></a>
      <a class="chip alt" href="${CONFIG.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a>
    </div>`;
  d.querySelector("[data-mail]").textContent = CONFIG.email;
  d.querySelector("[data-mailto]").href = "mailto:" + CONFIG.email;
  const copyBtn = d.querySelector("[data-copy]");
  const render = () => {
    const t = CONTACT[lang]; d.lang = lang;
    d.querySelector("[data-t=p]").textContent = t.p;
    copyBtn.textContent = t.copy;
    d.querySelector("[data-mailto]").textContent = t.mail;
  };
  copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(CONFIG.email)
      .then(() => { copyBtn.textContent = CONTACT[lang].copied; setTimeout(() => copyBtn.textContent = CONTACT[lang].copy, 1600); })
      .catch(() => { const r = document.createRange(); r.selectNodeContents(d.querySelector("[data-mail]")); getSelection().removeAllRanges(); getSelection().addRange(r); });
  });
  const sw = langSwitch(render);
  w._lang = sw._r;
  w.append(sw, d);
}

/* se arrastra tomando cualquier parte vacía de la ventana */
function makeDraggable(w){
  w.addEventListener("pointerdown", e => {
    if(isMobile() || e.button !== 0 || e.target.closest("button,a,.file,.mail,p,dl,h2,.lang")) return;
    const sx = e.clientX, sy = e.clientY;
    const x0 = parseFloat(w.style.getPropertyValue("--x")), y0 = parseFloat(w.style.getPropertyValue("--y"));
    w.setPointerCapture(e.pointerId); w.classList.add("dragging");
    const move = ev => {
      const x = Math.min(Math.max(x0 + ev.clientX - sx, -w.offsetWidth + 100), innerWidth - 100);
      const y = Math.min(Math.max(y0 + ev.clientY - sy, 0), innerHeight - 60);
      w.style.setProperty("--x", x+"px"); w.style.setProperty("--y", y+"px");
    };
    const up = () => { w.classList.remove("dragging"); w.removeEventListener("pointermove", move); w.removeEventListener("pointerup", up); };
    w.addEventListener("pointermove", move); w.addEventListener("pointerup", up);
  });
}

function placeholder(c, i){
  const base = `var(--${c.color})`;
  return `linear-gradient(${150+i*19}deg, color-mix(in oklab, ${base} 70%, #fff), color-mix(in oklab, ${base} 85%, #000 8%))`;
}
function hydrate(el){
  const v = el._v;
  getMeta(v.vm).then(m => {
    if(!m) return;
    const img = el.querySelector("img");
    if(m.th){ img.onload = () => img.classList.add("ok"); img.src = m.th; }
    if(m.d){ const d = el.querySelector("[data-dur]"); d.textContent = fmt(m.d); d.hidden = false; }
    if(m.w && m.hh) el.querySelector(".thumb").style.setProperty("--ar", `${m.w}/${m.hh}`);
  });
}
function hoverPreview(el, v){
  if(!v.preview || el._pv || matchMedia("(hover:none)").matches) return;
  const vid = document.createElement("video");
  Object.assign(vid, { muted:true, loop:true, playsInline:true, preload:"auto", src:v.preview });
  vid.addEventListener("canplay", () => vid.classList.add("ready"), {once:true});
  el.querySelector(".thumb").insertBefore(vid, el.querySelector(".dur"));
  el.addEventListener("pointerenter", () => vid.play().catch(()=>{}));
  el.addEventListener("pointerleave", () => { vid.pause(); vid.currentTime = 0; });
  vid.play().catch(()=>{});
  el._pv = vid;
}

/* precalienta Vimeo y los datos de una carpeta apenas hay intención */
const warmed = new Set();
function warm(c){
  if(!warmed.size){
    ["https://player.vimeo.com","https://f.vimeocdn.com"].forEach(h => {
      const l = document.createElement("link"); l.rel = "preconnect"; l.href = h; document.head.appendChild(l);
    });
  }
  if(warmed.has(c.key)) return; warmed.add(c.key);
  const idle = window.requestIdleCallback || (f => setTimeout(f, 200));
  idle(() => c.videos.forEach(v => getMeta(v.vm)));
}

/* ---- reproductor: un solo iframe, se crea al abrir y se destruye al cerrar ---- */
let pCat = null, pIdx = 0, lastFocus = null;
function openPlayer(c, i){
  pCat = c; pIdx = i; lastFocus = document.activeElement;
  $("#player").hidden = false; $("#scrim").hidden = false;
  loadInPlayer(); $("#pClose").focus();
}
function loadInPlayer(){
  const list = pCat.videos.filter(v => v.vm), v = pCat.videos[pIdx];
  const m = cache[v.vm.id+(v.vm.h||"")] || {};
  const r = (m.w && m.hh) ? m.w/m.hh : ((v.vertical ?? pCat.vertical) ? .5625 : 1.7778);
  const p = $("#player"), box = $("#pBox");
  box.style.setProperty("--ar", String(r));
  p.style.setProperty("--pw", `min(${r < 1 ? 420 : 1040}px, calc((100svh - 120px) * ${r}))`);
  box.innerHTML = `<span class="load">CARGANDO...</span>`;
  const q = new URLSearchParams({ autoplay:1, title:0, byline:0, portrait:0, dnt:1, color:"ffffff" });
  if(v.vm.h) q.set("h", v.vm.h);
  const f = document.createElement("iframe");
  f.src = `https://player.vimeo.com/video/${v.vm.id}?${q}`;
  f.allow = "autoplay; fullscreen; picture-in-picture"; f.allowFullscreen = true;
  f.title = v.title || "Video";
  box.appendChild(f);
  const name = v.title ? slug(v.title) : "video_" + pad(pIdx+1);
  $("#pCount").textContent = `${pCat.label} › ${name}.mp4 · ${list.indexOf(v)+1}/${list.length}`;
  $("#pExt").href = `https://vimeo.com/${v.vm.id}${v.vm.h?"/"+v.vm.h:""}`;
  const multi = list.length > 1;
  $("#pPrev").hidden = !multi; $("#pNext").hidden = !multi;
}
function step(d){
  const n = pCat.videos.length;
  for(let k=1;k<=n;k++){ const j = ((pIdx + d*k) % n + n) % n; if(pCat.videos[j].vm){ pIdx = j; break; } }
  loadInPlayer();
}
function closePlayer(){
  $("#pBox").innerHTML = ""; $("#player").hidden = true; $("#scrim").hidden = true;
  lastFocus && lastFocus.focus();
}
$("#pClose").onclick = closePlayer;
$("#scrim").onclick = closePlayer;
$("#pPrev").onclick = () => step(-1);
$("#pNext").onclick = () => step(1);
addEventListener("keydown", e => {
  if(!$("#player").hidden){
    if(e.key === "Escape") closePlayer();
    if(e.key === "ArrowRight") step(1);
    if(e.key === "ArrowLeft") step(-1);
    return;
  }
  if(e.key === "Escape"){
    const open = ALL.filter(it => it.win).sort((a,b) => b.win.style.zIndex - a.win.style.zIndex)[0];
    if(open) closeWin(open);
  }
});
/* click en el escritorio vacío: deselecciona (como en una compu) */
$("#top").addEventListener("pointerdown", e => { if(e.target === $("#top") || e.target.closest(".wall")) document.activeElement?.blur?.(); });

/* ---- menú: cada ítem abre su ventana; HOME cierra todo ---- */
document.querySelectorAll("nav.top a").forEach(a => a.addEventListener("click", e => {
  e.preventDefault();
  if(a.hasAttribute("data-home")){ ALL.forEach(it => it.win && closeWin(it)); return; }
  const it = ALL.find(x => x.key === a.dataset.open);
  if(it) openWin(it);
}));

/* ---- fondo: el video de Vimeo (loop, mudo) se pide después de cargar la página ---- */
addEventListener("load", () => {
  if(matchMedia("(prefers-reduced-motion:reduce)").matches || (navigator.connection && navigator.connection.saveData)) return;
  const vm = parseVimeo(CONFIG.heroVimeo); if(!vm) return;
  const q = new URLSearchParams({ background:1, autoplay:1, loop:1, muted:1, autopause:0, controls:0, dnt:1 });
  if(vm.h) q.set("h", vm.h);
  const f = document.createElement("iframe");
  f.src = `https://player.vimeo.com/video/${vm.id}?${q}`;
  f.allow = "autoplay; fullscreen"; f.tabIndex = -1; f.title = "Fondo";
  f.addEventListener("load", () => setTimeout(() => f.classList.add("on"), 400), {once:true});
  $("#wall").appendChild(f);
});

/* ---- si el link trae #ai, #brandeD, #podcast_vod, #about o #contacto, lo abre ---- */
const h = location.hash.slice(1);
const byHash = ALL.find(it => it.hash === h || it.alias === h);
if(byHash) requestAnimationFrame(() => openWin(byHash));
</script>
